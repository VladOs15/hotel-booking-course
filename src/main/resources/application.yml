server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: hotel-booking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hotels}
    username: ${DB_USERNAME:hotels}
    password: ${DB_PASSWORD:hotels}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/hotel_statistics}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: hotel-statistics-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: ru.course.hotelbooking.statistics
        spring.json.value.default.type: ru.course.hotelbooking.statistics.StatisticsEvent
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
app:
  kafka:
    topic: hotel-events
  admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
    email: ${APP_ADMIN_EMAIL:admin@example.com}
logging:
  level:
    org.apache.kafka: WARN
